<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Carrossel com Áudio</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #1e292b; 
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container externo que simula o tamanho do telemóvel no PC */
    .phone-container {
      height: 100vh;
      width: 100%;
      max-width: 56.25vh; 
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7); 
      position: relative;
      overflow: hidden;
      background: #000;
    }

    /* O carrossel agora roda apenas dentro do espaço do telemóvel */
    .carousel {
      height: 100vh;
      width: 100%;
      transition: transform 0.5s ease-in-out;
      cursor: grab;
    }
    
    .carousel:active {
      cursor: grabbing;
    }

    .slide {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
      flex-direction: column;
      width: 100%;
      user-select: none;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; 
    }

    audio {
      display: none;
    }

    /* BOTÕES FIXOS: Ficam sempre visíveis por cima de qualquer slide */
    .play-button {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      z-index: 10000; /* Garante que fica por cima de tudo */
    }

    .play-button img {
      width: 50px;
      height: 50px;
      transition: all 0.3s ease-in-out;
    }

    .play-button.animate img {
      transform: scale(0.5);
      opacity: 0;
    }

    .download-page-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      cursor: pointer;
      z-index: 10000;
    }

    .home-btn {
      position: absolute;
      bottom: 20px;
      right: 92px;
      width: 44px;
      height: 44px;
      z-index: 10000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    .home-btn svg { 
      width: 44px; 
      height: 44px; 
      display: block; 
    }

    /* Legenda */
    .legenda {
      position: absolute;
      bottom: 15%;
      width: 80%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 10px;
      border-radius: 10px;
    }
    
    .legenda-top { top: 3%; bottom: auto; }
    .legenda-bottom { bottom: 10%; top: auto; }
    .legenda-middle { top: 50%; bottom: auto; transform: translate(-50%, -50%); }
    .legenda span { transition: color 0.3s ease; }
    .palavra-ativa { color: yellow; }
  </style>

  <script>
  (function(){
    try {
      var ok = sessionStorage.getItem('acessoOK') === '1';
      if (!ok) { window.location.replace('../../index.html'); }
    } catch(e) { window.location.replace('../../index.html'); }
  })();
  </script>
</head>

<body>

  <div class="phone-container" id="phoneContainer">

    <div class="carousel" id="carousel">
      <section class="slide"><img alt="O Segredo do Pomar" src="images/01.jpg"/><div class="legenda" id="legenda0"></div><audio id="audio0" src="audio/01.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/02.jpg"/><div class="legenda" id="legenda1"></div><audio id="audio1" src="audio/02.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/03.jpg"/><div class="legenda" id="legenda2"></div><audio id="audio2" src="audio/03.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/04.jpg"/><div class="legenda" id="legenda3"></div><audio id="audio3" src="audio/04.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/05.jpg"/><div class="legenda" id="legenda4"></div><audio id="audio4" src="audio/05.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/06.jpg"/><div class="legenda" id="legenda5"></div><audio id="audio5" src="audio/06.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/07.jpg"/><div class="legenda" id="legenda6"></div><audio id="audio6" src="audio/07.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/08.jpg"/><div class="legenda" id="legenda7"></div><audio id="audio7" src="audio/08.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/09.jpg"/><div class="legenda" id="legenda8"></div><audio id="audio8" src="audio/09.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/10.jpg"/><div class="legenda" id="legenda9"></div><audio id="audio9" src="audio/10.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/11.jpg"/><div class="legenda" id="legenda10"></div><audio id="audio10" src="audio/11.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/12.jpg"/><div class="legenda" id="legenda11"></div><audio id="audio12" src="audio/12.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/13.jpg"/><div class="legenda" id="legenda12"></div><audio id="audio13" src="audio/13.mp3"></audio></section>
      <section class="slide"><img alt="O Segredo do Pomar" src="images/14.jpg"/><div class="legenda" id="legenda13"></div><audio id="audio13" src="audio/14.mp3"></audio></section>
    </div>

    <button class="play-button" id="playButton">
      <img alt="Play" id="btnIcon" src="images/play-icon.png"/>
    </button>

    <img alt="Download" class="download-page-btn" onclick="baixarImagem()" src="images/download-icon.png"/>

    <a class="home-btn" href="../../../index.html" title="Início" aria-label="Voltar ao início">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img">
        <circle cx="32" cy="32" r="32" fill="#FFC107"/>
        <path d="M16 30 L32 18 L48 30" fill="#fff"/>
        <rect x="20" y="30" width="24" height="18" rx="2" ry="2" fill="#fff"/>
        <rect x="29" y="36" width="6" height="12" rx="2" ry="2" fill="#FFC107"/>
      </svg>
    </a>

  </div>

  <audio id="transitionSound" preload="auto" src="audio/folha.mp3"></audio>
  <audio id="downloadSound" src="audio/botdow.mp3"></audio>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  
  <script>
    const carousel = document.getElementById("carousel");
    const phoneContainer = document.getElementById("phoneContainer");
    const slides = document.querySelectorAll(".slide");
    let startY = 0;
    let isDragging = false;
    let currentIndex = 0;
    const playBtn = document.getElementById("playButton");
    const btnIcon = document.getElementById("btnIcon");
    let isPlaying = false;

    function updateButtonIcon(isAudioPlaying) {
      playBtn.classList.add("animate");
      setTimeout(() => {
        btnIcon.src = isAudioPlaying ? "images/stop-icon.png" : "images/play-icon.png";
        playBtn.classList.remove("animate");
      }, 150);
    }

    function showSlide(index) {
      if (index === currentIndex) return;

      document.getElementById("transitionSound").play().catch(() => {});
      carousel.style.transform = `translateY(-${index * 100}vh)`;

      slides.forEach((slide, i) => {
        const audio = slide.querySelector("audio");
        if (audio && i !== index) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      setTimeout(() => {
        const currentAudio = slides[index].querySelector("audio");
        if (currentAudio) {
          currentAudio.play().then(() => {
            isPlaying = true;
            updateButtonIcon(true);
            iniciarSincronizacao(currentAudio, index);
          }).catch(() => {});
        }
      }, 1000);

      currentIndex = index;
    }

    // --- SISTEMA DE ARRASTO REAJUSTADO PARA O CONTAINER DO TELEMÓVEL ---
    // Touch (Celulares)
    phoneContainer.addEventListener("touchstart", (e) => { startY = e.touches[0].clientY; });
    phoneContainer.addEventListener("touchend", (e) => {
      let endY = e.changedTouches[0].clientY;
      analisarArrasto(startY, endY);
    });

    // Mouse (Computadores)
    phoneContainer.addEventListener("mousedown", (e) => {
      startY = e.clientY;
      isDragging = true;
    });
    window.addEventListener("mouseup", (e) => {
      if (!isDragging) return;
      isDragging = false;
      let endY = e.clientY;
      analisarArrasto(startY, endY);
    });

    function analisarArrasto(yInicial, yFinal) {
      if (yInicial - yFinal > 60 && currentIndex < slides.length - 1) {
        showSlide(currentIndex + 1);
      } else if (yFinal - yInicial > 60 && currentIndex > 0) {
        showSlide(currentIndex - 1);
      }
    }

    // Controle do Play/Pause
    playBtn.addEventListener("click", () => {
      const currentAudio = slides[currentIndex].querySelector("audio");
      if (isPlaying) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        isPlaying = false;
        updateButtonIcon(false);
      } else {
        currentAudio.play().then(() => {
          isPlaying = true;
          updateButtonIcon(true);
        }).catch(() => {});
      }
    });

    window.onload = () => {
      const currentAudio = slides[0].querySelector("audio");
      setTimeout(() => {
        if (currentAudio) {
          currentAudio.play().then(() => {
            isPlaying = true;
            updateButtonIcon(true);
            iniciarSincronizacao(currentAudio, 0); 
          }).catch((error) => {
            console.log("O áudio aguarda interação do usuário.");
          });
        }
      }, 1000);
    };

    slides.forEach(slide => {
      const audio = slide.querySelector("audio");
      if (audio) {
        audio.addEventListener("ended", () => {
          isPlaying = false;
          updateButtonIcon(false);
        });
      }
    });

    // Função de Download
    async function baixarImagem() {
      const sound = document.getElementById('downloadSound');
      if (sound) { sound.play().catch(() => {}); }

      const numeroArquivo = (currentIndex + 1).toString().padStart(2, '0');
      const caminhoImagem = `images/color${numeroArquivo}.jpeg`;

      try {
        const response = await fetch(caminhoImagem);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `arte_para_colorir_${numeroArquivo}.jpeg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
      } catch (erro) {
        console.log("Erro ao baixar imagem, tentando via captura de tela...", erro);
        html2canvas(slides[currentIndex]).then(canvas => {
          const link = document.createElement('a');
          link.download = `pagina_atual_${numeroArquivo}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      }
    }

    // Desbloqueio de áudio
    document.addEventListener("DOMContentLoaded", () => {
      function desbloquearTodosAudios() {
        document.querySelectorAll("audio").forEach(a => {
          a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
        });
        document.removeEventListener("click", desbloquearTodosAudios);
        document.removeEventListener("touchstart", desbloquearTodosAudios);
      }
      document.addEventListener("click", desbloquearTodosAudios, { once: true });
      document.addEventListener("touchstart", desbloquearTodosAudios, { once: true });
    });
  </script>

  <script src="legendas.js"></script>
</body>
</html>
